<title>ArtX iOS Design System</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500&family=Lato:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* The lock screen uses the system's own tokens, hardcoded here because the
     rest of them are inside the encrypted payload. */
  :root {
    --ground: #fafafb; --panel: #ffffff; --ink: #18181b; --ink-2: #55555a; --ink-3: #929299;
    --rule: #d5d5dc; --accent: #2563eb; --accent-wash: rgba(37,99,235,.07); --error: #b91c1c;
    --ja: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
    --en: "Lato", -apple-system, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --ground:#101012; --panel:#18181b; --ink:#fafafb; --ink-2:#b7b7be; --ink-3:#929299;
    --rule:rgba(255,255,255,.12); --accent:#6d9bf2; --accent-wash:rgba(109,155,242,.12); --error:#fca5a5; } }
  :root[data-theme="dark"] {
    --ground:#101012; --panel:#18181b; --ink:#fafafb; --ink-2:#b7b7be; --ink-3:#929299;
    --rule:rgba(255,255,255,.12); --accent:#6d9bf2; --accent-wash:rgba(109,155,242,.12); --error:#fca5a5; }

  * { box-sizing: border-box; }
  body { margin:0; background:var(--ground); color:var(--ink); font-family:var(--ja); font-size:15px; line-height:1.7; -webkit-font-smoothing:antialiased; }
  #gate { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 20px; }
  .card { width:100%; max-width:420px; background:var(--panel); border:1px solid var(--rule); border-radius:16px; padding:32px 28px; }
  .eyebrow { font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); margin:0 0 10px; }
  h1 { font-family:var(--en); font-weight:400; font-size:30px; line-height:1.15; letter-spacing:-.02em; margin:0 0 10px; }
  p.lede { margin:0 0 22px; color:var(--ink-2); font-size:14px; }
  label { display:block; font-size:13px; color:var(--ink-2); margin-bottom:6px; }
  input { width:100%; height:44px; padding:0 14px; border:1px solid var(--rule); border-radius:12px; background:var(--panel); color:var(--ink); font-family:var(--ja); font-size:16px; }
  input:focus { outline:none; border-color:var(--ink-3); }
  input[aria-invalid="true"] { border-color:var(--error); }
  button { margin-top:14px; width:100%; height:44px; border:0; border-radius:12px; background:var(--ink); color:var(--ground); font-family:var(--ja); font-size:16px; cursor:pointer; }
  button:disabled { opacity:.4; cursor:default; }
  .msg { margin-top:12px; font-size:13px; min-height:20px; }
  .msg.error { color:var(--error); }
  .msg.busy { color:var(--ink-3); }
  .foot { margin-top:22px; padding-top:18px; border-top:1px solid var(--rule); font-size:12.5px; color:var(--ink-3); }
  .foot code { font-family:var(--mono); font-size:11.5px; }
</style>

<div id="gate">
  <form class="card" id="form">
    <p class="eyebrow">ArtX iOS Design System</p>
    <h1>Design Tokens</h1>
    <p class="lede">このページはパスワードで保護されています。共有された合言葉を入力してください。</p>
    <label for="pw">パスワード</label>
    <input id="pw" name="pw" type="password" autocomplete="current-password" autofocus>
    <button type="submit" id="go">開く</button>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
    <div class="foot">
      中身は <code>AES-256-GCM</code> で暗号化されています。鍵は入力されたパスワードから
      <code>PBKDF2-SHA256</code>（25万回）で導出するため、正しいパスワードなしでは復号できません。
    </div>
  </form>
</div>

const ITERATIONS = 250000;

const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const form = document.getElementById('form');
const pw = document.getElementById('pw');
const go = document.getElementById('go');
const msg = document.getElementById('msg');

function say(text, kind) { msg.textContent = text; msg.className = 'msg' + (kind ? ' ' + kind : ''); }

async function unlock(password) {
  const enc = new TextEncoder();
  const material = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64(SALT), iterations: ITERATIONS, hash: 'SHA-256' },
    material, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
  );
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(IV) }, key, b64(DATA));
  return new TextDecoder().decode(plain);
}

/** Swap the gate for the decrypted document, re-running its scripts. */
function render(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  document.title = doc.title || document.title;
  doc.querySelectorAll('style').forEach((s) => document.head.appendChild(s.cloneNode(true)));
  document.body.innerHTML = doc.body.innerHTML;
  // innerHTML never executes scripts, so re-create each one.
  doc.querySelectorAll('script').forEach((s) => {
    const n = document.createElement('script');
    n.textContent = s.textContent;
    document.body.appendChild(n);
  });
  window.scrollTo(0, 0);
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!pw.value) return;
  if (!window.crypto || !crypto.subtle) {
    say('このブラウザでは復号できません（Web Crypto が使えません）。', 'error');
    return;
  }
  go.disabled = true;
  pw.setAttribute('aria-invalid', 'false');
  say('復号しています…', 'busy');
  try {
    const html = await unlock(pw.value);
    render(html);
  } catch (err) {
    go.disabled = false;
    pw.setAttribute('aria-invalid', 'true');
    pw.select();
    say('パスワードが違います。', 'error');
  }
});
